{% if DEFAULT_PAGINATION %}
  <nav class="pagination" aria-label="{{ _('Pagination') }}">
    {% if articles_page.has_next() %}
      <a class="btn float-left"
         href="{{ SITEURL }}/{{ articles_next_page.url }}"
         rel="prev"
         aria-label="{{ _('Older posts') }}">
        <i class="fa fa-angle-left" aria-hidden="true"></i> {{ _("Older Posts") }}
      </a>
    {% endif %}
    {% if articles_page.has_previous() %}
      <a class="btn float-right"
         href="{{ SITEURL }}/{{ articles_previous_page.url }}"
         rel="next"
         aria-label="{{ _('Newer posts') }}">
        {{ _("Newer Posts") }} <i class="fa fa-angle-right" aria-hidden="true"></i>
      </a>
    {% endif %}
  </nav>
{% endif %}
