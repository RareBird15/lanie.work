{% if 'pelican.plugins.search' in PLUGINS %}
  {% if STORK_VERSION %}
    <script src="https://files.stork-search.net/releases/v{{ STORK_VERSION }}/stork.js"></script>
    <script>stork.register("sitesearch", "{{ SITEURL }}/search-index.st", {showProgress: false});</script>
  {% else %}
    <script src="{{ SITEURL }}/{{ THEME_STATIC_DIR }}/stork/stork.js"></script>
    <script>stork.register("sitesearch", "{{ SITEURL }}/search-index.st", {showProgress: false});</script>
  {% endif %}
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var output = document.querySelector('[data-stork="sitesearch-output"]');
      if (!output) return;
      // Stork attaches a click handler to each <li> that calls preventDefault()
      // before selectResult(). This breaks keyboard activation (Enter/Space) when
      // focus lands directly on the <a> rather than being managed by Stork's
      // arrow-key selection. Intercept in capture phase to navigate via href.
      output.addEventListener('click', function (e) {
        var link = e.target.closest('.stork-result a[href]');
        if (link) {
          e.stopPropagation();
          window.location.assign(link.href);
        }
      }, true);
    });
  </script>
{% endif %}
