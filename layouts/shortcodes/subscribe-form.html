{{/* Newsletter subscribe form via Buttondown embed endpoint. */}}
<form
  action="https://buttondown.com/api/emails/embed-subscribe/RareBird15"
  method="post"
  class="embeddable-buttondown-form"
>
  <div>
    <label for="bd-email">Enter your email</label>
    <br>
    <input type="email" name="email" id="bd-email" maxlength="254" autocomplete="email" required>
  </div>
  <br>
  <button type="submit">Subscribe</button>
</form>
