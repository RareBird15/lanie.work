# Pre-commit hooks configuration for Hugo site
# Setup: uv run pre-commit install
# Run manually: uv run pre-commit run --all-files

exclude: ^(public/|resources/_gen/|\.hugo_build\.lock|\.venv/|\.venv-workers/|venv/|__pycache__/|node_modules/|vendor/|reports/|\.wrangler/|services/form-handler/python_modules/|themes/)

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        name: Trim trailing whitespace
      - id: end-of-file-fixer
        name: Fix end of files
      - id: check-yaml
        name: Check YAML syntax
      - id: check-toml
        name: Check TOML syntax
      - id: check-json
        name: Check JSON syntax
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: debug-statements
        name: Check Python debug statements

  # Python linting and formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.14
    hooks:
      - id: ruff
        name: Ruff lint Python
        args: ["--fix"]
      - id: ruff-format
        name: Ruff format Python

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.47.0
    hooks:
      - id: markdownlint
        name: Lint Markdown files
        args: ["--config", ".markdownlint.json"]
        files: \.md$

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.1
    hooks:
      - id: yamllint
        name: Lint YAML files
        args: ["-c", ".yamllint.yml"]

  # Check for common spelling mistakes
  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        name: Check spelling
        args: ["--ignore-words=.codespell-ignore.txt"]
        exclude: ^(package(-lock)?\.json|LICENSE|CNAME|go\.sum|uv\.lock|data/buffer-published\.json)$

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        name: ShellCheck shell scripts

  # GitHub Actions linting
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.8
    hooks:
      - id: actionlint
        name: Lint GitHub Actions workflows
