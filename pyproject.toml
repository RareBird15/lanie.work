[project]
name = "lanie-work"
version = "0.1.0"
description = "Personal blog and portfolio built with Pelican and Python."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "feedparser>=6.0.11",
  "Mastodon.py>=2.0.1",
  "markdown>=3.10.2",
  "pelican-readtime>=0.2.1",
  "pelican-seo>=1.4.0",
  "pelican-sitemap>=1.2.2",
  "pelican-yaml-metadata>=2.1.2",
  "pelican[markdown]>=4.11.0.post0",
  "pelican-related-posts>=1.0.0",
  "pelican-share-post>=1.2.1",
  "pelican-search>=1.1.1",
  "djlint>=1.36.4",
  "pelican-neighbors>=1.2.0",
  "pelican-minify>=2.0.1",
  "pelican-statistics>=1.0.0",
  "pelican-image-process>=3.3.0",
]

[dependency-groups]
dev = ["djlint>=1.36.4", "pre-commit>=4.5.1"]

[tool.djlint]
exclude = "output/"
ignore = "H006,H023,H031"

[tool.jinja-lsp]
templates = "./themes/reflex/templates"
backend = ["./pelicanconf.py", "./pelican_context.py"]
lang = "python"
