# axe-linter configuration
#
# These rules are disabled because Hugo templates can include generated values
# and conditional blocks that static parsing cannot fully resolve. That can
# cause false positives for the rules below in template source, even when the
# rendered output is valid.
rules:
  html-lang-valid: false # lang attr is set by template config and is valid at render time
  list: false # Conditional/list template blocks inside <ul> are not plain HTML nodes
