baseURL: https://lanie.work/
locale: en-us
title: "Lanie: Faith, Tech, and Advocacy"

# Tells Hugo to build the search index and standard feeds
outputs:
  home: [HTML, RSS, JSON]

params:
  colorScheme: congo
  defaultAppearance: auto
  autoSwitchAppearance: true

  # CRITICAL FIX: Changed from search.enable to global enableSearch
  enableSearch: true

  header:
    layout: basic

  author:
    name: "Lanie"
    bio: "Working at the intersection of faith, technology, and disability advocacy."
    links:
      - mastodon: "https://allovertheplace.ca/@RareBird15"
      - github: "https://github.com/RareBird15"
      - LinkedIn: "https://www.linkedin.com/in/laniecarmelo/"
      - CodeStats: "https://codestats.net/users/RareBird15"
      - Boot.dev Profile: "https://www.boot.dev/u/rarebird15"

  homepage:
    layout: page
    showRecent: false

  mainSections: ["advocacy", "technology", "gaming", "education", "faith"]

  article:
    showDate: true
    showReadingTime: true
    showTableOfContents: true
    showRelatedContent: true
    relatedContentLimit: 5
    showTaxonomies: true
    showSeries: true
    showAuthor: false
    showCodeCopyButton: true

  list:
    showSummary: true

  blog:
    postsPerPage: 12

menu:
  main:
    - name: About
      url: /about/
      weight: 10
    - name: Services
      url: /services/
      weight: 20
    - name: Work & Learning
      url: /work-and-learning/
      weight: 30
    - name: Beyond Blindness
      url: /beyond-blindness/
      weight: 40
    - name: Resources
      url: /resources/
      weight: 50
    - name: Blog
      url: /blog/
      weight: 60
    - name: Support
      url: /support/
      weight: 65
    - name: Connect
      url: /connect/
      weight: 68
    - name: Contact
      url: /contact/
      weight: 70

markup:
  goldmark:
    renderHooks:
      link:
        useEmbedded: always
    renderer:
      unsafe: true

module:
  imports:
    - path: github.com/jpanther/congo/v2

related:
  includeNewer: true
  threshold: 15
  indices:
    - name: tags
      weight: 90
    - name: categories
      weight: 70
