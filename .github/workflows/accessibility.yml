name: Accessibility Scan

on:
  workflow_dispatch:
    inputs:
      threshold:
        description: "Fail the job when violations >= this severity (minor|moderate|serious|critical)"
        required: false
        default: "serious"
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-accessibility:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: 0.165.0
          extended: true

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'

      - name: Build site
        run: hugo --minify

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: "24"

      - name: Install pa11y-ci and http-server
        run: npm install -g pa11y-ci http-server

      - name: Serve built site
        run: npx http-server ./public -p 4001 -c-1 &

      - name: Prepare reports directory
        if: always()
        run: mkdir -p reports

      - name: Run accessibility checks
        run: |
          pa11y-ci --config .pa11yci.json 2>&1 | tee pa11y-output.txt

      - name: Summarize pa11y output
        if: always()
        run: |
          echo "# Pa11y output" > reports/PA11Y_SUMMARY.md
          if [ -f pa11y-output.txt ]; then
            cat pa11y-output.txt >> reports/PA11Y_SUMMARY.md
          else
            echo "No pa11y output captured." >> reports/PA11Y_SUMMARY.md
          fi

      - name: Upload accessibility reports
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: accessibility-reports
          path: |
            reports/**
            pa11y-output.txt
