name: Post to Mastodon
on:
  check_run:
    types: [completed]

jobs:
  toot:
    if: github.event.check_run.conclusion == 'success' && github.event.check_run.name == 'Cloudflare Pages'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install feedparser Mastodon.py

      - name: Run post script
        env:
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
        run: python publish_to_mastodon.py
