name: Publish to Socials
on:
  check_run:
    types: [completed]

jobs:
  publish:
    # Only run if Cloudflare Pages deployment succeeded
    if: github.event.check_run.conclusion == 'success' && github.event.check_run.name == 'Cloudflare Pages'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Run Master Publisher
        env:
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        # uv run automatically handles dependencies if they are in your pyproject.toml
        # or we can specify them inline for a "zero-config" approach:
        run: |
          uv run --with feedparser --with mastodon.py --with requests --with python-dotenv scripts/publish_all.py
