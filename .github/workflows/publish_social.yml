name: Publish to Socials

on:
  check_run:
    types: [completed]

# Prevent concurrent runs from racing and double-posting
concurrency:
  group: publish-to-socials
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.check_run.conclusion == 'success' && github.event.check_run.name == 'Cloudflare Pages'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Install Hugo
        uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: 0.164.0
          extended: true

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          version: 0.11.28
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6.3.0
        with:
          python-version: "3.14.6"

      - name: Install Python dependencies
        run: uv sync

      - name: Build Hugo site
        run: hugo --minify

      - name: Publish latest post to Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          BUFFER_CHANNEL_IDS: ${{ secrets.BUFFER_CHANNEL_IDS }}
          BUFFER_FACEBOOK_CHANNEL_IDS: ${{ secrets.BUFFER_FACEBOOK_CHANNEL_IDS }}
        run: uv run ./scripts/publish_latest_to_buffer.py

      - name: Commit Buffer publish state
        run: |
          if git diff --quiet -- data/buffer-published.json; then
            echo "No Buffer publish state changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/buffer-published.json
          git commit -m "Update Buffer publish state"
          git push
