name: Deploy Form Handler Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "services/form-handler/**" # Only trigger if files in this folder change
      - ".github/workflows/deploy-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: 4.83.0
          workingDirectory: "services/form-handler"
          command: deploy
