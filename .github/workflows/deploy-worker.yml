name: Deploy Form Handler Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "services/form-handler/**"
      - ".github/workflows/deploy-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: 4.114.0
          workingDirectory: "services/form-handler"
          command: deploy
