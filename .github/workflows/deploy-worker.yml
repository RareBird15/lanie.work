name: Deploy Form Handler Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "services/form-handler/**" # Only trigger if files in this folder change
      - ".github/workflows/deploy-worker.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6.0.2

      - name: Deploy Worker
        id: deploy
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.83.0
          workingDirectory: "services/form-handler"
          command: deploy

      - name: Print Wrangler output
        if: always()
        env:
          WRANGLER_STDOUT: ${{ steps.deploy.outputs.command-output }}
          WRANGLER_STDERR: ${{ steps.deploy.outputs.command-stderr }}
        run: |
          echo "Wrangler stdout:"
          echo "$WRANGLER_STDOUT"
          echo
          echo "Wrangler stderr:"
          echo "$WRANGLER_STDERR"

      - name: Fail if deploy failed
        if: steps.deploy.outcome == 'failure'
        run: exit 1
