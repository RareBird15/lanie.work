name: Deploy Form Handler Worker

# DISABLED: The contact form has migrated to Formspree and the subscribe
# form has migrated to Buttondown. This Worker is no longer needed.
# Keeping the workflow file for historical reference. To re-enable,
# remove the "workflow_dispatch" restriction below and restore the
# push trigger.

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: 4.125.0
          workingDirectory: "services/form-handler"
          command: deploy
